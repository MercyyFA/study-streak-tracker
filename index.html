<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Subject Study Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <h1>Study Streak Tracker</h1>
    <p class="subtitle">Track consistency across all your subjects!</p>

    <!-- Add New Subject Form -->
    <div class="input-group">
      <input type="text" id="subject-input" placeholder="Enter subject (e.g. Math)...">
      <button id="add-btn">Add Subject</button>
    </div>

    <!-- Container where subject cards will appear -->
    <div id="subject-list"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
